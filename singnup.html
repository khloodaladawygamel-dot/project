<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="icon" href="./image/OIP.webp" type="image/x-icon">
    <title>singn up</title>
    <link rel="stylesheet" href="singnup.css">
     <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
</head>
<body>

    <div class="signup-container">
        <div class="image-side">
            <img src="./image/auth.png" alt="photo">
        </div>

        <div class="form-side">
            <div class="logo-area">
                <div class="icon-logo">
                    <i class="fa-solid fa-car-side"></i>
                </div>
                <div class="logo-text">
                    <h2>Rih<span class="highlight">la</span></h2>
                    <p>EGYPT TRAVEL</p>
                </div>
            </div>

            <div class="form-header">
                <h1>Create Account</h1>
                <p>Join 50,000+ travelers exploring Egypt</p>
            </div>

            <form class="auth-form">
                <div class="input-group">
                    <label>Full Name</label>
                    <input type="text" placeholder="name">
                </div>

                <div class="input-group">
                    <label>Email Address</label>
                    <input type="email" placeholder="name@example.com">
                </div>

                <div class="input-group">
                    <label>Password</label>
                    <input type="password" placeholder="********">
                </div>

                <div class="input-group">
                    <label>Confirm Password</label>
                    <input type="password" placeholder="********">
                </div>
                <a href="singnin.html"class="submit-btn" style="text-align: center;
                 text-decoration: none; display:block;">Create Account</a>
                <p class="login-redirect">
                    Didn’t receive OTP? <a href="login.html">Send Again</a>
                </p>
            </form>
        </div>
    </div>


</body>
</html>
