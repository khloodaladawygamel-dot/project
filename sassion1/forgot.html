<body>
     <div class="signup-container">

        <div class="form-side">
            <div class="logo-area">
                <div class="icon-logo">
                    <i class="fa-solid fa-car-side"></i>

            </div>

            <form>
                <div class="otp-container">
                    <div class="input-group">
                    <input class="otp-input" type="text" placeholder="2" />
                    <input class="otp-input" type="text" placeholder="3" />
                    <input class="otp-input" type="text" placeholder="7" />
                    <input class="otp-input" type="text" placeholder=""  />
                    </div>
                    
                    <div class="time"> 
                        <p>00:30</p>
                    </div>
                   
                <a href=""class="submit-btn" style="text-align: center;
                 text-decoration: none; display:block;">Send Verification Code</a>
              
              <p class="login-redirect">
                    Have an account? <a href="login.html">Signin</a>
                </p>
            </div>
            </form>
