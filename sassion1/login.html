<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="icon" href="./image/OIP.webp" type="image/x-icon">
    <title>login</title>
    <link rel="stylesheet" href="login.css">
     <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
</head>
<body>

      <div class="signup-container">
        <div class="image-side">
            <img src="./image/auth.png" alt="photo">
        </div>

        <div class="form-side">
            <div class="logo-area">
                <div class="icon-logo">
                    <i class="fa-solid fa-car-side"></i>
                </div>
                <div class="logo-text">
                    <h2>Rih<span class="highlight">la</span></h2>
                    <p>EGYPT TRAVEL</p>
                </div>
            </div>

            
            <div class="form-header">
                <h1>Welcome Back</h1>
                <p>Sign in to your account to continue your journey</p>
            </div>

            
            <form>
                <div class="input-group">
                    <label>Email Address</label>
                    <div class="input-field">
                        <input type="email" placeholder="name@example.com">
                    </div>
                </div>

                <div class="input-group">
                    <label>Password</label>
                    <div class="input-field">
                        <input type="password" placeholder="••••••••">
                        <i class="fa-regular fa-eye"></i>
                    </div>
                </div>

                 
                <div class="options-row">
                    <label class="remember-me">
                        <input type="checkbox"> Remember me
                    </label>
                    <a href="forgotpassword.html" class="forgot-link">Forgot password?</a>
                </div>
                 <a href="index.html"class="submit-btn" style="text-align: center;
                 text-decoration: none; display:block;">Login</a>
            
            </form>

            <div class="divider">
                <span>Or continue with</span>
            </div>

            <div class="social-login">
                <a href="http://www.google.com" class="social-btn"  style="text-align: center;
                 text-decoration: none; display:block;">
                    <i class="fa-brands fa-google"></i>
                     Google</a>
                <button ></button>
                <a href="http://apple.com" class="social-btn"  style="text-align: center;
                 text-decoration: none; display:block;">
                <i class="fa-brands fa-apple"></i> Apple</a>
            </div>

            <div class="bottom-redirect">
                <p>Don't have an account? <a href="singnup.html">Create account</a></p>
            </div>
        </div>
    </div>

</body>
</html>
